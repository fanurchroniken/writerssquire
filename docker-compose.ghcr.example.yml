# Example docker-compose.yml for using pre-built images from GitHub Container Registry
# Replace 'yourusername' with your GitHub username and 'writerssquire' with your repo name

version: '3.8'

services:
  backend:
    image: ghcr.io/yourusername/writerssquire/backend:latest
    container_name: writerssquire-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:80}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - writerssquire-network

  frontend:
    image: ghcr.io/yourusername/writerssquire/frontend:latest
    container_name: writerssquire-frontend
    ports:
      - "80:80"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - writerssquire-network

networks:
  writerssquire-network:
    driver: bridge
